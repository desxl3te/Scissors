<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя - Scissors Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/username.css">
</head>
<body>
    <div class="container">
        <h1>👤 Профиль пользователя</h1>
        
        <div class="user-card">
            <div class="user-info">
                <p><strong>Имя пользователя:</strong> <span id="username">guest</span></p>
                <p><strong>Email:</strong> <span id="email">guest@scissorsbar.ru</span></p>
                <p><strong>Роль:</strong> <span id="role">user</span></p>
                <p><strong>Дата регистрации:</strong> <span id="createdAt">-</span></p>
            </div>
            
            <h3 class="token-title">Текущий токен:</h3>
            <div class="token-box" id="token">Загрузка...</div>
            
            <div class="button-group">
                <button class="btn" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Обновить токен
                </button>
                <a href="index.html" class="btn btn-secondary">На главную</a>
            </div>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script src="js/username.js"></script>
</body>
</html>
