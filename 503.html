<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 — Сервис недоступен | Scissors Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles1.css">
    <link rel="stylesheet" href="css/errors.css">
</head>
<body>
    <main class="error-page">
        <div class="error-container">
            <div class="error-icon"><i class="fas fa-tools"></i></div>
            <h1 class="error-code">503</h1>
            <h2 class="error-title">Сервис временно недоступен</h2>
            <p class="error-message">
                Один из сервисов проекта еще не запущен или находится на перезапуске.
            </p>
            <div class="error-hint">
                <strong>Чаще всего нужно:</strong><br>
                Поднять FastAPI, Flask dashboard и локальный статический сервер frontend.
            </div>
            <div class="error-actions">
                <a href="index.html" class="error-btn">
                    <i class="fas fa-home"></i> На главную
                </a>
                <a href="about.html" class="error-btn secondary">
                    <i class="fas fa-info-circle"></i> О проекте
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="js/errors.js"></script>
</body>
</html>
