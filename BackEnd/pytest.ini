[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=app
    --cov=dashboard_service
    --cov-report=term-missing
    --cov-report=html:htmlcov
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning